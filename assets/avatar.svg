<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img"
     aria-label="Adrià Martínez Colomer — Industrial, Automation and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C9FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#00C9FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00C9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363D" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="800" rx="28" fill="url(#bg)"/>
  <rect width="600" height="800" rx="28" fill="url(#grid)"/>
  <rect width="600" height="800" rx="28" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="597" height="797" rx="27" fill="none" stroke="#30363D" stroke-width="2"/>

  <!-- circuit nodes -->
  <g stroke="url(#acc)" stroke-width="2" fill="none" opacity="0.5">
    <path d="M60 120 H160 V200"/>
    <path d="M540 680 H440 V600"/>
  </g>
  <g fill="#00C9FF" opacity="0.8">
    <circle cx="60" cy="120" r="5"/>
    <circle cx="160" cy="200" r="5"/>
    <circle cx="540" cy="680" r="5"/>
    <circle cx="440" cy="600" r="5"/>
  </g>

  <!-- monogram -->
  <text x="300" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-weight="800" font-size="200" letter-spacing="-8" fill="url(#acc)">AMC</text>
  <circle cx="468" cy="300" r="12" fill="#00C9FF"/>

  <!-- name + role -->
  <text x="300" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-weight="700" font-size="40" fill="#E6EDF3">Adrià Martínez Colomer</text>
  <text x="300" y="520" text-anchor="middle" font-family="Consolas, monospace"
        font-weight="500" font-size="22" letter-spacing="3" fill="#8B949E">INDUSTRIAL · AUTOMATION · AI</text>

  <!-- bottom rule -->
  <rect x="220" y="560" width="160" height="4" rx="2" fill="url(#acc)"/>
</svg>
